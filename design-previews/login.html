<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入示意｜精五門</title><style>:root{font-family:'Noto Sans TC',system-ui,sans-serif;color:#292330;background:#ece8f3;font-size:18px}*{box-sizing:border-box}body{margin:0}header{max-width:1000px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between}a{color:#3d2e61}header a{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:24px;font-weight:700}header img{width:60px;border-radius:10px}.notice{background:#3d2e61;color:white;text-align:center;padding:12px;font-size:15px}main{max-width:540px;margin:48px auto;padding:0 20px}.card{background:white;border:1px solid #d8d0e2;border-radius:16px;padding:32px}h1{font-size:32px}p{line-height:1.8;color:#514d59}label{display:block;margin:24px 0 8px;font-weight:600}input{width:100%;font:inherit;padding:12px;border:1px solid #a79aad;border-radius:8px}button{font:inherit;font-weight:600;border:0;border-radius:8px;background:#3d2e61;color:white;padding:14px 20px;margin:20px 0;cursor:pointer;width:100%}.note{background:#f3eef7;padding:16px;border-radius:8px;font-size:15px}#status{color:#9a2940}</style></head><body><div class="notice">登入與管理權限操作示意・尚未連接正式帳號系統</div><header><a href="index.html"><img src="logo.png" alt="精五門標誌">精五門</a><a href="index.html" style="font-size:16px">回首頁</a></header><main><section class="card"><h1>管理者登入示意</h1><p>使用指定的管理者 Email，體驗管理介面的畫面與操作。</p><div class="note">此頁沒有真正的身分驗證，請勿輸入密碼或個人敏感資料。正式版需由伺服器驗證登入及權限。</div><form id="login"><label for="email">管理者 Email</label><input id="email" type="email" autocomplete="off" required placeholder="輸入管理者 Email"><button type="submit">進入管理介面示意</button><p id="status" role="alert"></p></form><a href="index.html">以訪客身分瀏覽</a></section></main><script>if(new URLSearchParams(location.search).has('logout')){sessionStorage.removeItem('pentaskill-demo-admin')}document.querySelector('#login').onsubmit=e=>{e.preventDefault();const email=document.querySelector('#email').value.trim().toLowerCase();if(email!=='pey514514@gmail.com'){document.querySelector('#status').textContent='此預覽僅提供指定管理者的介面示意';return}sessionStorage.setItem('pentaskill-demo-admin','true');location.href='index.html#admin-area'};</script></body></html>
